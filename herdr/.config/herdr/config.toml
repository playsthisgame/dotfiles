onboarding = false
[theme]
name = "gruvbox"
auto_switch = false

[ui]
sidebar_width = 26
pane_gaps = false

[ui.toast]
delivery = "system"

[keys]
prefix = "ctrl+space"

# ctrl+h/j/k/l are handled by the vim-herdr-navigation plugin (see below).
# Keep prefix-based focus as a fallback for leaving Vim/TUI panes at an edge.
focus_pane_left = "prefix+h"
focus_pane_down = "prefix+j"
focus_pane_up = "prefix+k"
focus_pane_right = "prefix+l"

split_vertical = "prefix+%"
split_horizontal = 'prefix+"'

new_tab = "prefix+c"

toggle_sidebar = "prefix+p"

# herdr-file-viewer: read-only git-aware file browser.
# Installed per-machine with `herdr plugin install smarzban/herdr-file-viewer`
# (lands in the gitignored plugins/github/, so only these binds are shared).
[[keys.command]]
key = "prefix+f"
type = "plugin_action"
command = "herdr-file-viewer.open-file-viewer"
description = "open file viewer in split"

[[keys.command]]
key = "prefix+F"
type = "plugin_action"
command = "herdr-file-viewer.open-file-viewer-tab"
description = "open file viewer in tab"

# vim-herdr-navigation: Vim-aware ctrl+h/j/k/l navigation.
# In a Vim/Neovim pane the key is forwarded to Vim (which crosses back into
# herdr at a split edge); in any other pane it just moves herdr's pane focus.
[[keys.command]]
key = "ctrl+h"
type = "plugin_action"
command = "vim-herdr-navigation.left"
description = "navigate left (vim/herdr)"

[[keys.command]]
key = "ctrl+j"
type = "plugin_action"
command = "vim-herdr-navigation.down"
description = "navigate down (vim/herdr)"

[[keys.command]]
key = "ctrl+k"
type = "plugin_action"
command = "vim-herdr-navigation.up"
description = "navigate up (vim/herdr)"

[[keys.command]]
key = "ctrl+l"
type = "plugin_action"
command = "vim-herdr-navigation.right"
description = "navigate right (vim/herdr)"

# ichigo config
[[keys.command]]
key = "prefix+i"
type = "plugin_action"
command = "herdr-api-client.open"
description = "open API client in split"

[[keys.command]]
key = "prefix+shift+i"
type = "plugin_action"
command = "herdr-api-client.open-tab"
description = "open API client in tab"
